appId: com.harbor.storage
productName: harbor0
artifactName: harbor0-${version}-${os}-${arch}.${ext}
icon: assets/icon.png
directories:
  output: release
  # Holds appx/ (Store tiles, generated by npm run generate:icons) and appx-manifest.xml.
  buildResources: assets
files:
  - dist/**/*
  - package.json
  # esbuild bundles everything the app needs into dist. Without this, electron-builder packs the
  # workspace root's dependencies (Next, AWS CDK, the AWS SDK…), which adds ~480 MB.
  - '!node_modules{,/**/*}'
mac:
  target: [dmg]
  category: public.app-category.productivity
  # Signed with the Developer ID certificate in this Mac's keychain, and notarized when
  # APPLE_KEYCHAIN_PROFILE names a notarytool profile (release-desktop.ts sets harbor0-notary).
  # Without it notarization is skipped with a warning, which is fine for local packages.
  identity: Anirban Deb Singha (U23MZA3U6P)
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
# Signed too, so the downloaded disk image itself passes Gatekeeper; release-desktop.ts notarizes it.
dmg:
  sign: true
win:
  target: [nsis]
linux:
  target: [AppImage, deb, rpm]
  category: Utility
  # deb and rpm require a maintainer; package.json has no author to take it from.
  maintainer: harbor0 <contact@harbor0.com>
  vendor: harbor0
  synopsis: Private storage, backup, sync, and sending
  executableName: harbor0
  # Names the window after harbor0.desktop, so docks group it with the launcher.
  syncDesktopName: true
# electron-builder's default package dependencies plus ALSA and GBM, which Electron also loads at
# start; desktops have them, minimal installs don’t. Ubuntu 24.04 renamed libasound2 to libasound2t64,
# which goes first: apt would otherwise take a libasound2 stub (liboss4-salsa-asound2) for it.
deb:
  depends:
    [
      libgtk-3-0,
      libnotify4,
      libnss3,
      libxss1,
      libxtst6,
      xdg-utils,
      libatspi2.0-0,
      libuuid1,
      libsecret-1-0,
      libasound2t64 | libasound2,
      libgbm1,
    ]
rpm:
  depends:
    [
      gtk3,
      libnotify,
      nss,
      libXScrnSaver,
      (libXtst or libXtst6),
      xdg-utils,
      at-spi2-core,
      (libuuid or libuuid1),
      alsa-lib,
      mesa-libgbm,
    ]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# The Microsoft Store package, built with `--win appx` on Windows (see .github/workflows/msix.yml).
# The Store signs it on submission. The identity values come from Partner Center → Product
# identity and must match it exactly.
appx:
  identityName: harbor0.harbor0
  publisher: CN=23C8851E-0613-4335-A3C1-131C80C8678E
  publisherDisplayName: harbor0
  displayName: harbor0
  applicationId: harbor0
  backgroundColor: transparent
  languages: [en-US]
  customManifestPath: appx-manifest.xml
  # Windows 10 1809; the toast activator and the command alias need newer than the default.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
